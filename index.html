<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MI AI - Quantum Core 3D</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* ================= CSS VARIABLES & RESET ================= */
        :root {
            --primary-neon: #00ffcc;
            --secondary-neon: #ff00ff;
            --bg-glass: rgba(15, 23, 42, 0.7);
            --border-glass: rgba(0, 255, 204, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        body { background: #050505; color: white; overflow: hidden; height: 100vh; width: 100vw; }

        /* ================= 3D CANVAS & BACKGROUND ================= */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* ================= GLASSMORPHISM UI ================= */
        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .neon-text {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px var(--primary-neon), 0 0 20px var(--primary-neon);
        }

        .neon-border { box-shadow: 0 0 15px var(--primary-neon) inset, 0 0 15px var(--primary-neon); }

        /* ================= APP LAYOUT ================= */
        #app-container { display: none; height: 100vh; width: 100vw; flex-direction: column; }
        
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); }
        
        main { flex: 1; display: flex; overflow: hidden; position: relative; }
        
        /* Views */
        .view-section { display: none; width: 100%; height: 100%; flex-direction: column; padding: 20px; overflow-y: auto; }
        .view-section.active { display: flex; animation: fadeIn 0.5s ease-in-out; }

        /* Chat UI */
        #chat-box { flex: 1; overflow-y: auto; padding-right: 10px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 18px; border-radius: 20px; font-size: 1.1rem; line-height: 1.4; animation: slideUp 0.3s ease; }
        .msg-user { background: rgba(0, 255, 204, 0.1); border: 1px solid var(--primary-neon); align-self: flex-end; border-bottom-right-radius: 5px; }
        .msg-ai { background: rgba(255, 0, 255, 0.1); border: 1px solid var(--secondary-neon); align-self: flex-start; border-bottom-left-radius: 5px; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary-neon); border-radius: 10px; }

        /* Bottom Nav (Mobile App Feel) */
        footer { padding: 15px 20px; display: flex; justify-content: space-around; border-top: 1px solid var(--border-glass); background: rgba(0,0,0,0.5); }
        .nav-btn { font-size: 1.5rem; color: #888; transition: 0.3s; cursor: pointer; }
        .nav-btn.active { color: var(--primary-neon); text-shadow: 0 0 10px var(--primary-neon); transform: scale(1.1); }

        /* Input Area */
        .input-area { display: flex; gap: 10px; margin-top: 15px; }
        input[type="text"] { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); color: white; padding: 15px; border-radius: 30px; outline: none; font-size: 1.1rem; }
        input[type="text"]:focus { border-color: var(--primary-neon); box-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .send-btn { background: var(--primary-neon); color: black; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        .send-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px var(--primary-neon); }

        /* ================= LOGIN SCREEN ================= */
        #login-screen { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
        .login-card { text-align: center; padding: 40px; width: 90%; max-width: 400px; }
        .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px; margin-top: 30px; background: white; color: #333; border-radius: 30px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .google-btn:hover { background: #eee; transform: translateY(-3px); }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseLogo { 0% { text-shadow: 0 0 10px var(--primary-neon); } 50% { text-shadow: 0 0 30px var(--primary-neon), 0 0 50px var(--secondary-neon); } 100% { text-shadow: 0 0 10px var(--primary-neon); } }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="login-screen">
        <div class="glass-panel login-card">
            <h1 class="neon-text text-5xl mb-2" style="animation: pulseLogo 2s infinite;">MI AI</h1>
            <p class="text-gray-300 text-lg tracking-widest mb-6">QUANTUM CORE ENTERPRISE</p>
            <div class="w-full h-px bg-gradient-to-r from-transparent via-teal-400 to-transparent my-4"></div>
            <p class="text-sm text-teal-200 mt-4">Connect to the mainframe</p>
            <button id="login-btn" class="google-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20" alt="G">
                Initialize Secure Login
            </button>
        </div>
    </div>

    <div id="app-container">
        <header class="glass-panel mx-2 mt-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border-2 border-teal-400 overflow-hidden">
                    <img id="user-avatar" src="https://via.placeholder.com/150" alt="User">
                </div>
                <div>
                    <h2 id="user-name" class="font-bold text-lg leading-tight">Agent</h2>
                    <p class="text-xs text-teal-400 flex items-center gap-1"><i class="fas fa-circle text-[8px]"></i> Realtime Sync On</p>
                </div>
            </div>
            <button id="logout-btn" class="text-red-400 hover:text-red-300"><i class="fas fa-power-off text-xl"></i></button>
        </header>

        <main>
            <div id="view-chat" class="view-section active">
                <div id="chat-box" class="glass-panel p-4 mb-2">
                    <div class="msg msg-ai neon-text text-sm mb-4 text-center mx-auto !bg-transparent !border-none">
                        SYSTEM ONLINE. WELCOME TO MI AI CORE.
                    </div>
                    </div>
                <div class="input-area glass-panel p-2">
                    <input type="text" id="ai-input" placeholder="Initiate quantum sequence..." autocomplete="off">
                    <button id="send-btn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="view-dashboard" class="view-section">
                <div class="glass-panel p-6 h-full overflow-y-auto">
                    <h2 class="neon-text text-3xl mb-6">DATA ANALYSIS</h2>
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-black/50 p-4 rounded-xl border border-teal-400/30 text-center">
                            <h3 class="text-teal-400 text-sm">Total Queries</h3>
                            <p id="stat-queries" class="text-3xl font-bold">0</p>
                        </div>
                        <div class="bg-black/50 p-4 rounded-xl border border-fuchsia-400/30 text-center">
                            <h3 class="text-fuchsia-400 text-sm">System Load</h3>
                            <p class="text-3xl font-bold">98%</p>
                        </div>
                    </div>
                    <div class="w-full bg-black/50 p-4 rounded-xl border border-teal-400/30">
                        <canvas id="activityChart"></canvas>
                    </div>
                </div>
            </div>

            <div id="view-settings" class="view-section">
                <div class="glass-panel p-6 h-full">
                    <h2 class="neon-text text-3xl mb-6">CORE CONFIG</h2>
                    <div class="space-y-4">
                        <div class="p-4 bg-black/40 rounded-xl">
                            <label class="block text-teal-400 text-sm mb-2">MI AI Engine Power</label>
                            <input type="range" class="w-full accent-teal-400">
                        </div>
                        <div class="p-4 bg-black/40 rounded-xl">
                            <label class="block text-teal-400 text-sm mb-2">Developer info</label>
                            <p class="text-white text-lg">Architect: Muaaz Iqbal</p>
                            <p class="text-gray-400 text-sm">Muslim Islam Enterprise</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="glass-panel mx-2 mb-2 rounded-full">
            <i class="fas fa-comment-dots nav-btn active" data-target="view-chat"></i>
            <i class="fas fa-chart-pie nav-btn" data-target="view-dashboard"></i>
            <i class="fas fa-cog nav-btn" data-target="view-settings"></i>
        </footer>
    </div>

    <script type="module">
        // 1. IMPORT FIREBASE V10 SDK (Modern Module Approach)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, push, onValue, serverTimestamp, set, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // 2. FIREBASE CONFIG (Tumhari Di Gayi Details)
        const firebaseConfig = {
            apiKey: "AIzaSyBbnU8DkthpYQMHOLLyj6M0cc05qXfjMcw",
            authDomain: "ramadan-2385b.firebaseapp.com",
            databaseURL: "https://ramadan-2385b-default-rtdb.firebaseio.com",
            projectId: "ramadan-2385b",
            storageBucket: "ramadan-2385b.firebasestorage.app",
            messagingSenderId: "882828936310",
            appId: "1:882828936310:web:7f97b921031fe130fe4b57"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        // App State
        let currentUser = null;
        let queryCount = 0;

        // UI Elements
        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userNameEl = document.getElementById('user-name');
        const userAvatarEl = document.getElementById('user-avatar');
        
        // Chat UI
        const chatBox = document.getElementById('chat-box');
        const aiInput = document.getElementById('ai-input');
        const sendBtn = document.getElementById('send-btn');
        const statQueries = document.getElementById('stat-queries');

        // ================= AUTHENTICATION LOGIC =================
        
        loginBtn.addEventListener('click', async () => {
            try {
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Initializing...';
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Error:", error);
                alert("Login Failed: " + error.message);
                loginBtn.innerHTML = 'Initialize Secure Login';
            }
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginScreen.style.display = 'none';
                appContainer.style.display = 'flex';
                userNameEl.innerText = user.displayName;
                userAvatarEl.src = user.photoURL;
                
                // Save user to DB & Load Chats
                saveUserToDB(user);
                loadChats();
                initChart();
            } else {
                currentUser = null;
                loginScreen.style.display = 'flex';
                appContainer.style.display = 'none';
                loginBtn.innerHTML = '<img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20" alt="G"> Initialize Secure Login';
            }
        });

        // ================= DATABASE LOGIC =================

        function saveUserToDB(user) {
            const userRef = ref(db, 'users/' + user.uid);
            set(userRef, {
                name: user.displayName,
                email: user.email,
                lastLogin: serverTimestamp()
            });
        }

        function loadChats() {
            if (!currentUser) return;
            const chatRef = ref(db, `chats/${currentUser.uid}`);
            
            // Listen for realtime updates
            onValue(chatRef, (snapshot) => {
                chatBox.innerHTML = ''; // Clear box
                queryCount = 0;
                
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        appendMessage(data.text, data.sender === 'user' ? 'msg-user' : 'msg-ai', false);
                        if(data.sender === 'user') queryCount++;
                    });
                    statQueries.innerText = queryCount;
                } else {
                    appendMessage("SYSTEM ONLINE. WELCOME TO MI AI CORE.", 'msg-ai', false);
                }
                scrollToBottom();
            });
        }

        async function processUserMessage() {
            const text = aiInput.value.trim();
            if (!text || !currentUser) return;

            // 1. Show user message instantly
            aiInput.value = '';
            
            // 2. Save user message to Firebase
            const chatRef = ref(db, `chats/${currentUser.uid}`);
            await push(chatRef, {
                text: text,
                sender: 'user',
                timestamp: serverTimestamp()
            });

            // 3. Simulate AI typing & Response (Since frontend)
            setTimeout(async () => {
                // Here you would normally call your backend Python API (Gemini/Groq)
                // For this pure HTML demo, we simulate a smart response.
                const aiResponse = generateSmartResponse(text);
                
                // Save AI response to Firebase
                await push(chatRef, {
                    text: aiResponse,
                    sender: 'ai',
                    timestamp: serverTimestamp()
                });
            }, 1500);
        }

        function appendMessage(text, className, animate = true) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            if(!animate) div.style.animation = 'none';
            // Parse basic markdown for bold/code
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            formattedText = formattedText.replace(/`(.*?)`/g, '<code class="bg-black/50 px-1 rounded text-teal-300">$1</code>');
            div.innerHTML = formattedText;
            chatBox.appendChild(div);
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Mock AI Brain logic
        function generateSmartResponse(prompt) {
            const p = prompt.toLowerCase();
            if(p.includes('code') || p.includes('html')) return "Initializing Code Compiler... Generating `HTML5` structure. The integration of Firebase Realtime modules is optimal.";
            if(p.includes('muaaz') || p.includes('creator')) return "I was architected by the visionary **Muaaz Iqbal**. Organization: **Muslim Islam**.";
            if(p.includes('dhmaka') || p.includes('pro')) return "🚀 Initiating MAX PRO Mode! System operating at 100% capacity. Database synced.";
            return "Query processed. MI AI Quantum Core is analyzing the parameters of: '" + prompt + "'. Data recorded in Firebase.";
        }

        // Event Listeners for Chat
        sendBtn.addEventListener('click', processUserMessage);
        aiInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') processUserMessage();
        });

        // ================= UI NAVIGATION =================
        const navBtns = document.querySelectorAll('.nav-btn');
        const views = document.querySelectorAll('.view-section');

        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Update buttons
                navBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // Update views
                const target = btn.getAttribute('data-target');
                views.forEach(v => {
                    v.classList.remove('active');
                    if(v.id === target) v.classList.add('active');
                });
            });
        });

        // ================= CHART.JS (DASHBOARD) =================
        function initChart() {
            const ctx = document.getElementById('activityChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'Neural Network Activity',
                        data: [12, 19, 3, 5, 2, 3, 20],
                        borderColor: '#00ffcc',
                        backgroundColor: 'rgba(0, 255, 204, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { 
                        x: { grid: { display: false, color: 'rgba(255,255,255,0.1)' }, ticks: {color: '#888'} },
                        y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: {color: '#888'} }
                    }
                }
            });
        }

        // ================= THREE.JS 3D BACKGROUND (THE DHMAKA) =================
        const canvasContainer = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        canvasContainer.appendChild(renderer.domElement);

        // Create Particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 2000;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        // Material
        const material = new THREE.PointsMaterial({
            size: 0.015,
            color: 0x00ffcc,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(particlesGeometry, material);
        scene.add(particlesMesh);
        camera.position.z = 3;

        // Mouse Interaction
        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = event.clientX / window.innerWidth - 0.5;
            mouseY = event.clientY / window.innerHeight - 0.5;
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            particlesMesh.rotation.x += 0.0005;
            
            // Subtle interactive movement
            particlesMesh.rotation.y += mouseX * 0.01;
            particlesMesh.rotation.x += mouseY * 0.01;

            renderer.render(scene, camera);
        }
        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
